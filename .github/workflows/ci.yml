name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Ankit Abhishek Portfolio'
          path: '.'
          format: 'JSON'
          args: '--out reports --scan .'
        continue-on-error: true

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/*

      - name: Fail on CVSS >= 9
        if: always()
        run: |
          set -euo pipefail
          REPORT=reports/dependency-check-report.json
          if [ ! -f "$REPORT" ]; then
            echo "Report not found: $REPORT"
            exit 1
          fi
          if ! command -v jq >/dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          if jq -e '.dependencies[]?.vulnerabilities[]? | select((.cvssScore // .cvssV3?.baseScore) >= 9)' "$REPORT" > /dev/null; then
            echo "Dependency-check found vulnerabilities with CVSS >= 9:"
            jq -r '.dependencies[]?.vulnerabilities[]? | select((.cvssScore // .cvssV3?.baseScore) >= 9) | "\(.name) CVSS: \(.cvssScore // .cvssV3?.baseScore) \(.description // \"No description\")"' "$REPORT" || true
            exit 1
          else
            echo "No CVSS >= 9 vulnerabilities"
          fi

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test
        run: |
          npx serve -s dist -l 5000 &
          sleep 5
          curl -f http://localhost:5000